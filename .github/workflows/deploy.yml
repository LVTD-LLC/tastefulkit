name: Deploy Prod

concurrency:
  group: tastefulkit-production
  cancel-in-progress: false

on:
  push:
    branches:
      - main

env:
  CAPROVER_APP_NAME: tastefulkit

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        id: image
        shell: bash
        run: echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: deployment/Dockerfile
          build-args: DEPLOYMENT_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/LVTD-LLC/tastefulkit
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ github.sha }}

      - name: Snapshot public URLs before deployment
        run: python apps/pages/indexnow.py --site-url https://tastefulkit.com --snapshot indexnow-before.json

      - name: Retain URL snapshot for submission recovery
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-before-${{ github.sha }}
          path: indexnow-before.json
          retention-days: 90

      - name: Deploy server to CapRover
        uses: caprover/deploy-from-github@v1.2.0
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ env.CAPROVER_APP_NAME }}
          token: ${{ secrets.APP_TOKEN }}
          image: ${{ steps.image.outputs.image_name }}:${{ github.sha }}

      - name: Verify workers process type
        shell: bash
        env:
          WORKERS_APP_PROCESS_TYPE: ${{ vars.WORKERS_APP_PROCESS_TYPE }}
        run: |
          if [ "$WORKERS_APP_PROCESS_TYPE" != "worker" ]; then
            echo "::error::Set the WORKERS_APP_PROCESS_TYPE repository variable to 'worker' after setting APP_PROCESS_TYPE=worker on the $CAPROVER_APP_NAME-workers CapRover app."
            exit 1
          fi

      - name: Deploy workers to CapRover
        uses: caprover/deploy-from-github@v1.2.0
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ env.CAPROVER_APP_NAME }}-workers
          token: ${{ secrets.WORKERS_APP_TOKEN }}
          image: ${{ steps.image.outputs.image_name }}:${{ github.sha }}

      - name: Verify live revision and notify IndexNow
        timeout-minutes: 15
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: >-
          python apps/pages/indexnow.py --site-url https://tastefulkit.com
          --previous indexnow-before.json --expected-revision "$EXPECTED_REVISION"
