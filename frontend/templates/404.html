{% load static %}
<!DOCTYPE html>
<html lang="en" class="antialiased">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>404 - Page not found | TastefulKit</title>
        <meta name="description"
              content="The page you are looking for could not be found." />
        <meta name="robots" content="noindex, follow" />
        {% include "components/favicon.html" %}
        <link rel="stylesheet" href="{% static 'css/app.css' %}" />
        <script>
            // Match the site theme without loading application or analytics scripts.
            try {
                var theme = localStorage.getItem("theme");
                document.documentElement.classList.toggle("dark", theme === "dark" ||
                    (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches));
            } catch (e) {
                // The error page remains usable when browser storage is unavailable.
            }
        </script>
    </head>
    <body class="bg-white dark:bg-gray-900">
        <main class="grid place-items-center px-6 py-24 min-h-[80vh] bg-white sm:py-32 lg:px-8 dark:bg-gray-900">
            <div class="text-center">
                <p class="text-base font-semibold text-orange-600 dark:text-orange-400">404</p>
                <h1 class="mt-4 text-5xl font-semibold tracking-tight text-gray-900 text-balance sm:text-7xl dark:text-white">Page not found</h1>
                <p class="mt-6 text-lg font-medium text-gray-500 text-pretty sm:text-xl/8 dark:text-gray-400">Sorry, we couldn't find the page you're looking for.</p>
                <div class="flex gap-x-6 justify-center items-center mt-10">
                    <a href="{% url 'landing' %}"
                       class="rounded-md bg-orange-600 px-3.5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-orange-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-orange-600 dark:bg-orange-500 dark:hover:bg-orange-400 dark:focus-visible:outline-orange-500">Go back home</a>
                    <a href="mailto:hello%40tastefulkit.com"
                       class="text-sm font-semibold text-gray-900 dark:text-white">Contact support <span aria-hidden="true">→</span></a>
                </div>
            </div>
        </main>
    </body>
</html>
