{% for section in navigation %}
    <div class="tk-docs-nav-section">
        <h2 class="tk-docs-nav-heading">{{ section.category }}</h2>
        <ul>
            {% for page in section.pages %}
                <li>
                    <a href="{{ page.url }}"
                       {% if current_category == section.category_slug and current_page == page.slug %}aria-current="page"{% endif %}>{{ page.title }}</a>
                </li>
            {% endfor %}
        </ul>
    </div>
{% endfor %}
