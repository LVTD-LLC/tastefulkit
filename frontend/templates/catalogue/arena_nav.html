<div class="tk-discovery-nav">
    <nav class="tk-tabs" aria-label="Design discovery">
        {% for item in discovery_sections %}
            <a href="{{ item.url }}"
               {% if item.active %}aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
    </nav>
    <nav class="tk-tabs" aria-label="Content types">
        {% for item in discovery_types %}
            <a href="{{ item.url }}"
               {% if item.active %}aria-current="page"{% endif %}>{{ item.label }}</a>
        {% endfor %}
    </nav>
</div>
